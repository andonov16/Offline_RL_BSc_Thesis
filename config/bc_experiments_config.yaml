experiment:
  name: "bc_optimization"
  seed: 16
  n_optuna_trials: 15
  max_epochs: 150
  batch_size: 128
  early_stopping_criterion_epochs: 5
  stratified_train_set_ratio: 1

search_space:
  dropout:
    type: "float"
    low: 0.0
    high: 0.1
    step: 0.02

  lr:
    type: "float"
    low: 1e-4
    high: 1e-3
    log: true

  num_hidden_neurons:
    type: "int"
    low: 32
    high: 256
    step: 32

  num_hidden_layers:
    type: "int"
    low: 2
    high: 6

runtime:
  device: "cuda"
  best_model_dir: "../../models/BC"
  log_dir: "../../logs/BC"
